<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assalamualaikum</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 20px;
        }

        .container {
            text-align: center;
            background: white;
            padding: 60px 40px;
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            max-width: 500px;
            width: 100%;
        }

        h1 {
            font-size: 48px;
            color: #333;
            margin-bottom: 10px;
            font-weight: bold;
        }

        p {
            font-size: 18px;
            color: #666;
            line-height: 1.6;
            margin-bottom: 20px;
        }

        .arabic {
            font-size: 42px;
            color: #667eea;
            margin-bottom: 40px;
            font-weight: bold;
        }

        .form-section {
            text-align: left;
            margin-top: 30px;
            padding-top: 30px;
            border-top: 2px solid #eee;
        }

        .form-section h2 {
            font-size: 24px;
            color: #333;
            margin-bottom: 20px;
            text-align: center;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-size: 16px;
            color: #333;
            margin-bottom: 8px;
            font-weight: bold;
        }

        input[type="text"],
        input[type="number"],
        select {
            width: 100%;
            padding: 12px;
            font-size: 16px;
            border: 2px solid #ddd;
            border-radius: 8px;
            transition: border-color 0.3s;
        }

        input[type="text"]:focus,
        input[type="number"]:focus,
        select:focus {
            outline: none;
            border-color: #667eea;
        }

        .radio-group {
            display: flex;
            gap: 20px;
            margin-top: 8px;
        }

        .radio-group label {
            display: flex;
            align-items: center;
            margin-bottom: 0;
            font-weight: normal;
            gap: 8px;
        }

        input[type="radio"] {
            width: 18px;
            height: 18px;
            cursor: pointer;
        }

        button {
            width: 100%;
            padding: 12px;
            font-size: 18px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: transform 0.2s;
            margin-top: 20px;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .output {
            margin-top: 30px;
            padding: 20px;
            background: #f0f4ff;
            border-radius: 8px;
            display: none;
            text-align: center;
        }

        .output.show {
            display: block;
        }

        .output h3 {
            color: #667eea;
            margin-bottom: 15px;
            font-size: 22px;
        }

        .output p {
            color: #333;
            margin: 10px 0;
            font-size: 16px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Assalamualaikum</h1>
        <p>Peace be upon you and the mercy of God and His blessings</p>
        <div class="arabic">السلام عليكم ورحمة الله وبركاته</div>

        <div class="form-section">
            <h2>Tell Us About You</h2>
            <form id="greetingForm">
                <div class="form-group">
                    <label for="name">Name:</label>
                    <input type="text" id="name" name="name" required placeholder="Enter your name">
                </div>

                <div class="form-group">
                    <label for="age">Age:</label>
                    <input type="number" id="age" name="age" required min="1" max="120" placeholder="Enter your age">
                </div>

                <div class="form-group">
                    <label>Gender:</label>
                    <div class="radio-group">
                        <label>
                            <input type="radio" name="gender" value="Male" required> Male
                        </label>
                        <label>
                            <input type="radio" name="gender" value="Female" required> Female
                        </label>
                        <label>
                            <input type="radio" name="gender" value="Other" required> Other
                        </label>
                    </div>
                </div>

                <div class="form-group">
                    <label for="region">Region:</label>
                    <select id="region" name="region" required>
                        <option value="">Select your region</option>
                        <option value="North America">North America</option>
                        <option value="South America">South America</option>
                        <option value="Europe">Europe</option>
                        <option value="Africa">Africa</option>
                        <option value="Asia">Asia</option>
                        <option value="Middle East">Middle East</option>
                        <option value="Oceania">Oceania</option>
                        <option value="Other">Other</option>
                    </select>
                </div>

                <button type="submit">Submit</button>
            </form>

            <div class="output" id="output">
                <h3>Welcome!</h3>
                <p id="outputText"></p>
            </div>
        </div>
    </div>

    <script>
        document.getElementById('greetingForm').addEventListener('submit', function(e) {
            e.preventDefault();

            const name = document.getElementById('name').value;
            const age = document.getElementById('age').value;
            const gender = document.querySelector('input[name="gender"]:checked').value;
            const region = document.getElementById('region').value;

            const outputText = `
                Name: ${name}<br>
                Age: ${age}<br>
                Gender: ${gender}<br>
                Region: ${region}
            `;

            document.getElementById('outputText').innerHTML = outputText;
            document.getElementById('output').classList.add('show');
        });
    </script>
</body>
</html>
